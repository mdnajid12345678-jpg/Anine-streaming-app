name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudstream-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assemblePrereleaseRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-release-apk
          path: app/build/outputs/apk/prerelease/release/*.apk
          if-no-files-found: error
          retention-days: 14
