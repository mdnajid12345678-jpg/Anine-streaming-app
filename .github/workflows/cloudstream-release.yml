name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudstream-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Supabase configuration presence
        env:
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          echo "SUPABASE_URL present: $HAS_SUPABASE_URL"
          echo "SUPABASE_PUBLISHABLE_KEY present: $HAS_SUPABASE_PUBLISHABLE_KEY"
          echo "SUPABASE_ANON_KEY present: $HAS_SUPABASE_ANON_KEY"
          echo "SUPABASE_SERVICE_ROLE_KEY present: $HAS_SUPABASE_SERVICE_ROLE_KEY (must never be used in the APK)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assemblePrereleaseRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: cloudstream-release-apk
          path: app/build/outputs/apk/prerelease/release/*.apk
          if-no-files-found: error
          retention-days: 14
